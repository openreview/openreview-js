name: Meta Extraction Service

on:
  pull_request:
    branches: [master]
    paths:
      - services/meta-extraction/**
      - .github/workflows/meta-extraction-service.yml
  push:
    branches: [master]
    paths:
      - services/meta-extraction/**
      - .github/workflows/meta-extraction-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg NODE_VERSION=${{ matrix.node-version }} -t meta-extraction services/meta-extraction
      - name: Start service
        run: docker run -d --name meta-extraction -p 8080:8080 meta-extraction
      - name: Check Node.js version
        run: |
          version=$(docker exec meta-extraction node --version)
          echo "Node.js $version"
          [[ $version == v${{ matrix.node-version }}.* ]]
      - name: Check missing URL is rejected
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8080/metadata)
          cat response.json
          [ "$status" = 400 ]
          grep -q '"name":"ValidationError"' response.json
      - name: Check Chrome launches
        run: |
          docker exec meta-extraction node --input-type=module -e "
            import puppeteer from 'puppeteer';
            const browser = await puppeteer.launch({ headless: true });
            console.log(await browser.version());
            await browser.close();
          "
      - name: Show service logs
        if: failure()
        run: docker logs meta-extraction || true
